server{
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  # SPA Fallback: Redirect 404s to index.html for client-side routing
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API Proxy: Forward /api/ requests to the backend service
  # NO trailing slash on proxy_pass ensures the path is passed correctly
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy Admin Panel
  location /admin/ {
      proxy_pass http://backend:8000;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy Static files (CSS/JS) For UI/UX Admin Panel Django
  location /static/ {
    alias /usr/share/nginx/html/static/;
    expires 30d;
    add_header Cache-Control "public, no-transform";
  }

  # Cache Control: Long-lived headers for hashed assets
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
