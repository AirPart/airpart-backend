---
tags:
  - invoice

summary: Create invoice
description: Select products and reduce their quantity from inventory

consumes:
  - application/json

produces:
  - application/json

parameters:
  - in: body
    name: body
    required: true
    description: List of products for invoice
    schema:
      type: object
      properties:
        products:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1
              qty:
                type: integer
                example: 2

responses:
  200:
    description: Invoice processed successfully
    schema:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1
              qty:
                type: integer
                example: 2
        message:
          type: string
          example: Invoice processed successfully
        success:
          type: boolian
          example: true
