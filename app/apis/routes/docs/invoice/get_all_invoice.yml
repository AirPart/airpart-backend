tags:
  - invoice

summary: Get all invoice
description: Returns a list of all invoice from the database

responses:
  200:
    description: Invoice list successfully received
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Invoice list successfully received.
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1
              products:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    qty:
                      type: integer
                      example: 2
              timestamp:
                type: float
                example: 1782048073.703105

  500:
    description: Internal server error
