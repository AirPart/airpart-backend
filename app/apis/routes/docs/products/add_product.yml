tags:
  - Products

summary: Add a product

description: >
  Creates a new product in the database/storage.

  The request body must be sent as JSON.
  The endpoint builds a Product object from the provided fields and saves it.

  Notes:
  - If `id` is not provided, the Product model
  may generate one automatically depending on model behavior.
  - If `timestamp` is not provided or is null,
  the Product model may generate a timestamp automatically.
  - This route currently does not perform request body
  validation before creating the Product object.

consumes:
  - application/json

produces:
  - application/json

parameters:
  - name: body
    in: body
    required: true
    description: Product data
    schema:
      type: object
      properties:
        description:
          type: string
          example: Test Product
        part_number:
          type: string
          example: PN-001
        serial_number:
          type: string
          example: SN-001
        qty:
          type: number
          example: 10
        unit:
          type: string
          example: PCS
        price:
          type: number
          example: 100.0
        alternate:
          type: string
          example: ALT-001
        company:
          type: string
          example: Test Company

responses:
  201:
    description: Product added successfully
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Product added successfully.
        data:
          type: object
          properties:
            id:
              type: string
              example: prod-1
            description:
              type: string
              example: Test Product
            part_number:
              type: string
              example: PN-001
            serial_number:
              type: string
              example: SN-001
            qty:
              type: number
              example: 10
            unit:
              type: string
              example: PCS
            price:
              type: number
              example: 100.0
            alternate:
              type: string
              example: ALT-001
            company:
              type: string
              example: Test Company
            document:
              type: string
              nullable: true
              example: /path/to/document.pdf
            image:
              type: string
              nullable: true
              example: /path/to/image.png
            timestamp:
              type: number
              nullable: true
              example: 1785939010.714315

  500:
    description: Internal server error while adding product
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Internal server error while adding product.
