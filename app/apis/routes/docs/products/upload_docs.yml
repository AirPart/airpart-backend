---
tags:
  - Products

summary: Upload product document (PDF)

description: >
  Uploads a product document and stores it on the server.
  The request must be sent as `multipart/form-data`
  with a file field named `document`.

  Notes:
  - Only PDF files are allowed.
  - The server generates a unique filename.
  - The API response currently does NOT return `document_url`
  (even though the service produces it).

consumes:
  - multipart/form-data

produces:
  - application/json

parameters:
  - name: id_product
    in: path
    type: string
    required: true
    description: Product ID
    example: prod-1

  - name: document
    in: formData
    type: file
    required: true
    description: PDF file to upload (only `.pdf` is accepted)

responses:
  200:
    description: Document uploaded successfully
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: document uploaded successfuly

  400:
    description: |
      Bad request.
      Possible reasons:
      - "document" field is missing in form-data
      - empty filename
      - invalid file type (only pdf allowed)
      - product not found
      - upload processing failed (caught exception)
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: No document file provided
        errors:
          description: >
            Can be either:
            - an object (field-level errors), e.g. {"document": "..."}
            - a string (service error message),
            e.g. "Invalid file or file type not allowed"
          oneOf:
            - type: object
              properties:
                document:
                  type: string
                  example: File is required
            - type: string
              example: Invalid file or file type not allowed

  500:
    description: Internal backend error (unexpected service response)
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Internal backend error
