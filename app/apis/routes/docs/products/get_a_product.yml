---
tags:
  - Products

summary: Get a product by ID

description: >
  Retrieves a single product by product ID.

  If the product exists, its full data is returned in the `data` field.
  If the product does not exist,
  the endpoint returns a `404 Not Found` response.

produces:
  - application/json

parameters:
  - name: id_product
    in: path
    type: string
    required: true
    description: Product ID
    example: prod-1

responses:
  200:
    description: Product received successfully
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Product received successfully.
        data:
          type: object
          properties:
            id:
              type: string
              example: prod-1
            description:
              type: string
              example: Test Product
            part_number:
              type: string
              example: PN-001
            serial_number:
              type: string
              example: SN-001
            qty:
              type: number
              example: 10
            unit:
              type: string
              example: PCS
            price:
              type: number
              example: 100.0
            alternate:
              type: string
              example: ALT-001
            company:
              type: string
              example: Test Company
            document:
              type: string
              nullable: true
              example: /path/to/document.pdf
            image:
              type: string
              nullable: true
              example: /path/to/image.png
            timestamp:
              type: number
              nullable: true
              example: 1785939010.714315

  404:
    description: Product not found
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Product with ID 'prod-1' not found.
        errors:
          type: object
          properties:
            id:
              type: string
              example: Product with ID 'prod-1' not found.

  500:
    description: Internal server error while getting product
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Internal server error while getting product.
