---
tags:
  - Products

summary: Get all products

description: |
  Retrieves the full list of products from the database/storage.

  This endpoint returns all available products in the `data` field.

produces:
  - application/json

responses:
  200:
    description: Product list successfully received
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Product list successfully received.
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                example: prod-1
              description:
                type: string
                example: Test Product
              part_number:
                type: string
                example: PN-001
              serial_number:
                type: string
                example: SN-001
              qty:
                type: number
                example: 10
              unit:
                type: string
                example: PCS
              price:
                type: number
                example: 100.0
              alternate:
                type: string
                example: ALT-001
              company:
                type: string
                example: Test Company
              document:
                type: string
                nullable: true
                example: /path/to/document.pdf
              image:
                type: string
                nullable: true
                example: /path/to/image.png
              timestamp:
                type: number
                nullable: true
                example: 1785939010.714315

  500:
    description: Internal server error while retrieving product list
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Internal server error while retrieving product list.
